<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>とさでん交通在線モニター</title>
<style>
:root{--bg:#061018;--panel:#07151c;--text:#e9f6ff;--muted:#86a3b8;--train-color:#ffffff;--station-bg:#062634;--station-border:#0f5c77}
html,body{height:100%;margin:0;font-family:"Yu Gothic",Meiryo,system-ui}
body{background:var(--bg);color:var(--text);overflow:hidden;display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ===== ヘッダー: 左(タイトル/運用日/学休日) | 中央(時刻) | 右(操作) を grid で並べる(重ならない) ===== */
.header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"left time ctl";align-items:center;column-gap:16px;row-gap:6px;padding:8px 14px;flex-shrink:0;border-bottom:1px solid #12222e}
.hd-left{grid-area:left;display:flex;flex-direction:column;gap:4px;min-width:0;align-items:flex-start}
.title{font-size:20px;margin:0;font-weight:700;line-height:1.2}
.hd-opts{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px}
.day-selector{display:flex;align-items:center;gap:8px}
.day-label{font-size:14px;color:var(--text);font-weight:500;white-space:nowrap}
.time-display{grid-area:time;display:flex;justify-content:center}
.bigtime{font-size:48px;font-weight:700;background:transparent;border:0;color:var(--text);padding:0;font-family:monospace;letter-spacing:3px;text-align:center;width:6.2em;max-width:100%}
.controls{grid-area:ctl;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.controls-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.jump-rows{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.btn{background:transparent;border:1px solid #123;padding:7px 12px;border-radius:6px;color:var(--text);cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{background:rgba(255,255,255,0.05)}
.btn-play{font-size:16px;padding:10px 20px;font-weight:600;border:2px solid #0f5c77;background:rgba(15,92,119,0.2);min-width:7em}
.btn-play:hover{background:rgba(15,92,119,0.4)}
.select{background:transparent;border:1px solid #123;color:var(--text);padding:7px 10px;border-radius:6px;font-size:14px;font-weight:500}
.select option{background:var(--bg);color:var(--text)}
.adj-toggle{display:none}

/* ===== 路線図 ===== */
.container{flex:1 1 auto;min-height:0;padding:4px 12px 8px 12px;box-sizing:border-box;width:100%;position:relative;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
#svgwrap{width:100%;height:100%;display:block}
svg{display:block}
.station-rect{fill:var(--station-bg);stroke:var(--station-border);stroke-width:1.0;rx:6;ry:6}
.station-text{fill:var(--text);font-size:12px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.track-line{stroke:#0f2b3b;stroke-width:8;stroke-linecap:round}
.tick{stroke:#0f2b3b;stroke-width:2}
.trip-label{fill:var(--text);font-size:12px}
.train-circle{stroke:#0007;stroke-width:0.8;fill:var(--train-color)}
.tooltip{position:fixed;pointer-events:none;display:none;background:#051720;border:1px solid #123;padding:8px;border-radius:6px;color:var(--text);z-index:40;min-width:180px;font-size:13px}
.timetable-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:100}
.timetable-content{background:var(--panel);border:2px solid var(--station-border);border-radius:12px;padding:20px;width:min(600px,94vw);box-sizing:border-box;max-height:86vh;overflow:auto;color:var(--text)}
.timetable-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--station-border)}
.timetable-title{font-size:18px;font-weight:700}
.close-btn{background:transparent;border:1px solid #123;padding:6px 12px;border-radius:6px;color:var(--text);cursor:pointer;font-size:14px}
.close-btn:hover{background:rgba(255,255,255,0.1)}
.timetable-table{width:100%;border-collapse:collapse;margin-top:12px}
.timetable-table th,.timetable-table td{padding:8px 12px;text-align:left;border-bottom:1px solid rgba(15,92,119,0.3)}
.timetable-table th{background:rgba(15,92,119,0.2);font-weight:600;font-size:13px}
.timetable-table td{font-size:13px}
.timetable-info{margin-top:12px;padding:10px;background:rgba(15,92,119,0.1);border-radius:6px;font-size:13px}
.timetable-info strong{color:var(--text)}

/* ===== フッター ===== */
.footer{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;background:var(--bg);border-top:1px solid #123}
.legend{color:var(--muted);font-size:13px;line-height:1.5;min-width:0}
#train_count{background:#051720;color:var(--text);padding:8px 12px;border:1px solid #123;font-size:15px;font-weight:600;white-space:nowrap}

.title-wrap{display:flex;flex-direction:column;gap:2px}
.data-info{font-size:11px;color:var(--muted)}
.data-info:empty{display:none}
.target-bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.target-bar:empty{display:none}
.tb-label{color:#ffb000;font-weight:600}
.tb-chip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border:1px solid #ffb000;border-radius:10px;color:#ffb000}
.tb-chip b{cursor:pointer;padding:0 2px}
.sec-title{margin:14px 0 6px;font-weight:700;font-size:14px}
.fm-panel{margin-top:12px;padding:10px;border:1px solid #ffb00066;border-radius:8px;background:rgba(255,176,0,0.06)}
.fm-panel label{font-size:14px}
.fm-panel input[type=text]{background:#051720;border:1px solid var(--station-border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:16px;width:8em;margin-left:4px}
.fm-chk{margin-left:14px;cursor:pointer;white-space:nowrap}
.fm-hint{font-size:11px;color:var(--muted);margin-top:6px}
.op-wrap{overflow-x:auto}
.op-table{width:100%;border-collapse:collapse;font-size:12px}
.op-table th,.op-table td{padding:5px 8px;border-bottom:1px solid rgba(15,92,119,0.3);text-align:left;white-space:nowrap}
.op-table th{background:rgba(15,92,119,0.2)}
.op-table td:nth-child(2){white-space:normal}
.op-table tr[data-tid]{cursor:pointer}
.op-table tr.cur{background:rgba(255,176,0,0.2)}
.op-note{font-size:11px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text);cursor:pointer;white-space:nowrap}

/* ===== 中くらいの幅 / 横向きスマホ: 1行にまとめ、±時刻ボタンは「時刻調整」で開閉 ===== */
@media (max-width:1100px),(max-height:500px){
  .header{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"left time ctl";padding:6px 10px;column-gap:10px}
  .title{font-size:16px}
  .bigtime{font-size:34px;letter-spacing:2px}
  .btn{padding:6px 9px;font-size:13px}
  .btn-play{padding:7px 14px;font-size:14px;min-width:6em}
  .select{padding:6px 8px;font-size:13px}
  .adj-toggle{display:inline-block}
  .jump-rows{display:none}
  .jump-rows.open{display:flex}
  .container{padding:2px 6px 6px}
  .footer{padding:5px 10px}
  .legend{font-size:11px}
  #train_count{font-size:13px;padding:5px 9px}
}
/* ===== 縦向きスマホ: 左/時刻/操作 を縦に積む ===== */
@media (max-width:620px){
  .header{grid-template-columns:minmax(0,1fr);grid-template-areas:"left" "time" "ctl";row-gap:2px;padding:6px 10px}
  .hd-left{align-items:center;text-align:center}
  .hd-opts{justify-content:center}
  .bigtime{font-size:36px;width:100%}
  .controls{align-items:center}
  .controls-row,.jump-rows{justify-content:center;align-items:center}
  .legend{font-size:10px}
  .footer{gap:8px}
}
/* 横向きスマホ(高さが低い): さらに詰める */
@media (max-height:500px){
  .title{font-size:14px}
  .data-info{display:none}
  .bigtime{font-size:28px}
  .legend{display:none}
  .footer{justify-content:flex-end;padding:3px 10px}
}
</style>
</head>

const LAY_FS=12,LAY_PITCH=76,LAY_KMIN=0.7,LAY_KMAX=2,LAY_GAP=10;

function renderTrains(){if(!svgWrap)return;const svg=svgWrap.querySelector('svg');if(!svg)return;const g=svg.querySelector('#trains');if(!g)return;g.innerHTML='';selShown=false;let fallbackIndex=1;const renderedTrips=new Set();waitingTrains={};let trainCount=0;Object.keys(trips).forEach(tid=>{if(renderedTrips.has(tid))return;if(tripDayType[tid]&&tripDayType[tid]!==currentDayType)return;if(!showSchoolOff&&tripMeta[tid]&&tripMeta[tid].schoolOff)return;const seq=trips[tid];const route=tripRoute[tid]||'UNK';let trainRendered=false;const lastStop=seq[seq.length-1];const lastArrival=lastStop&&lastStop.arrival!=null?lastStop.arrival:null;if(lastArrival!=null){const opNum=opMap[tid];const dayType=tripDayType[tid]||'weekday';const opKey=dayType+'_'+opNum;const opTrips=tripsByOperation[opKey]||[];let nextTrip=null;for(let i=0;i<opTrips.length;i++){if(opTrips[i].tid===tid&&i+1<opTrips.length){nextTrip=opTrips[i+1];break}}if(currentTime>=lastArrival&&nextTrip&&currentTime<nextTrip.firstDeparture){const stationName=normalizeName(lastStop.stop_name||'');if(!waitingTrains[stationName])waitingTrains[stationName]=[];let direction='down';for(let i=seq.length-2;i>=0;i--){const a=seq[i],b=seq[i+1];const aName=normalizeName(a.stop_name||'');const bName=normalizeName(b.stop_name||'');let idxA=-1,idxB=-1;for(let r=0;r<ROWS;r++){const stations=ROWS_STATIONS[r];for(let si=0;si<stations.length;si++){const sNorm=normalizeName(stations[si]);if(sNorm===aName)idxA=si;if(sNorm===bName)idxB=si}if(idxA>=0&&idxB>=0)break}if(idxA>=0&&idxB>=0){direction=(idxB>idxA)?'down':'up';break}}direction=(direction==='up')?'down':'up';{const nd=tripStartDirection(nextTrip.tid);if(nd)direction=nd}waitingTrains[stationName].push({tid,endTime:lastArrival,direction,nextDeparture:nextTrip.firstDeparture,nextTripId:nextTrip.tid});renderedTrips.add(tid);trainRendered=true;trainCount++}}if(trainRendered)return;for(let i=0;i<seq.length-1;i++){const a=seq[i],b=seq[i+1];if(a.departure==null||b.arrival==null)continue;if(currentTime<a.departure||currentTime>b.arrival)continue;const opNum=getOperationNumber(tid,fallbackIndex);const aName=normalizeName(a.stop_name||'');const bName=normalizeName(b.stop_name||'');let rowIndex=-1,idxA=-1,idxB=-1,rowA=-1,rowB=-1;if(route==='SN'){for(let r=ROWS-SN_ROWS;r<ROWS;r++){const stations=ROWS_STATIONS[r];for(let si=0;si<stations.length;si++){const sNorm=normalizeName(stations[si]);if(sNorm===aName&&rowA<0){rowA=r;idxA=si}if(sNorm===bName&&rowB<0){rowB=r;idxB=si}}}}else{for(let r=0;r<ROWS;r++){const stations=ROWS_STATIONS[r];for(let si=0;si<stations.length;si++){const sNorm=normalizeName(stations[si]);if(sNorm===aName&&rowA<0){rowA=r;idxA=si}if(sNorm===bName&&rowB<0){rowB=r;idxB=si}}}}if(rowA>=0&&rowB>=0){if(rowA===rowB){rowIndex=rowA}else{rowIndex=rowA;if(rowB===rowA+1){idxB=ROWS_STATIONS[rowA].length-1}else{idxB=idxA}}}if(rowIndex<0){for(let r=0;r<ROWS;r++){const stations=ROWS_STATIONS[r].map(s=>normalizeName(s));let ai=-1,bi=-1;for(let si=0;si<stations.length;si++){if(stations[si]===aName)ai=si;if(stations[si]===bName)bi=si}if(ai>=0&&bi>=0){rowIndex=r;idxA=ai;idxB=bi;break}}}if(rowIndex<0){rowIndex=(route==='SN')?ROWS-SN_ROWS:0;idxA=ROWS_STATIONS[rowIndex].indexOf(a.stop_name);idxB=ROWS_STATIONS[rowIndex].indexOf(b.stop_name)}if(rowIndex<0)continue;const pos=stationPos[rowIndex];const n=pos.length;const xA=pos[Math.max(0,Math.min(n-1,idxA>=0?idxA:0))];const xB=pos[Math.max(0,Math.min(n-1,idxB>=0?idxB:n-1))];let cx=xA;if(xB!==xA){const ratio=(currentTime-a.departure)/((b.arrival-a.departure)||1);cx=xA+(xB-xA)*ratio}const yCenter=rowY[rowIndex];const topY=yCenter-18,botY=yCenter+18;let cy=(idxB>idxA)?topY:(idxB<idxA?botY:topY);const circle=document.createElementNS(SVG_NS,'circle');circle.setAttribute('cx',cx);circle.setAttribute('cy',cy);circle.setAttribute('r',8);circle.setAttribute('class','train-circle');styleTrain(circle,tid);circle.style.cursor='pointer';markHit(circle,tid);if(selectedKey===tid){drawSel(g,cx,cy);showTooltip(tid,a,b,cx,cy);tipHint()}g.appendChild(circle);const opNumFinal=getOperationNumber(tid,fallbackIndex++);const destChar=getDestCharByStops(seq,tid);const labelText=opNumFinal+destChar+fmtTag(tid);const label=document.createElementNS(SVG_NS,'text');label.setAttribute('x',cx+(idxB>idxA?14:-14));label.setAttribute('y',cy+5);label.setAttribute('class','trip-label');label.setAttribute('text-anchor',idxB>idxA?'start':'end');label.textContent=labelText;styleLabel(label,tid);g.appendChild(label);trainRendered=true;renderedTrips.add(tid);trainCount++;label.style.pointerEvents='none';break}});Object.keys(waitingTrains).forEach(stationName=>{const trains=waitingTrains[stationName];if(!trains.length)return;let rowIndex=-1,stationIdx=-1;for(let r=0;r<ROWS;r++){const stations=ROWS_STATIONS[r];for(let si=0;si<stations.length;si++){if(normalizeName(stations[si])===stationName){rowIndex=r;stationIdx=si;break}}if(rowIndex>=0)break}if(rowIndex<0)return;const yCenter=rowY[rowIndex];const topY=yCenter-18,botY=yCenter+18;const xPos=stationPos[rowIndex][stationIdx];const dirCount={down:0,up:0};const gh=Math.max(14,Math.min(30,((rowY[1]-rowY[0])-36)/2));trains.slice().sort((p,q)=>(p.nextDeparture-q.nextDeparture)||(p.endTime-q.endTime)).forEach((train)=>{const direction=train.direction;const k=dirCount[direction]++;const baseY=(direction==='down')?topY:botY;const offsetY=(k===0)?0:((direction==='down')?(-gh-(k-1)*20):(gh+(k-1)*20));const cy=baseY+offsetY;const circle=document.createElementNS(SVG_NS,'circle');circle.setAttribute('cx',xPos);circle.setAttribute('cy',cy);circle.setAttribute('r',8);circle.setAttribute('class','train-circle');styleTrain(circle,train.tid);circle.style.cursor='pointer';circle.style.opacity='0.8';markHit(circle,train.nextTripId||train.tid);if(selectedKey===(train.nextTripId||train.tid)){drawSel(g,xPos,cy);showWaitingTooltip(train.tid,stationName,train.nextDeparture,xPos,cy,train.nextTripId);tipHint()}g.appendChild(circle);const opNum=getOperationNumber(train.tid,fallbackIndex++);const destChar=getDestCharByStops(trips[train.tid],train.tid);const labelText=opNum+destChar+fmtTag(train.tid);const label=document.createElementNS(SVG_NS,'text');label.setAttribute('x',xPos+14);label.setAttribute('y',cy+5);label.setAttribute('class','trip-label');label.setAttribute('text-anchor','start');label.textContent=labelText;styleLabel(label,train.tid);label.style.opacity='0.8';g.appendChild(label);label.style.pointerEvents='none'})});const trainCountDiv=document.getElementById('train_count');if(trainCountDiv)trainCountDiv.textContent='運行中: '+trainCount+'両';if(selectedKey&&!selShown){selectedKey=null;hideTooltip()}}
function showTooltip(tid,a,b,cx,cy){tooltip.style.display='block';const opNum=opMap[tid]||'?';const destChar=getDestCharByStops(trips[tid],tid);tooltip.innerHTML='<div style="font-weight:700">'+opNum+destChar+vehTag(tid)+'</div><div style="margin-top:6px"><b>前:</b> '+(a.stop_name||'-')+' '+(a.departure?secToHHMMSS(a.departure):'')+'</div><div><b>次:</b> '+(b.stop_name||'-')+' '+(b.arrival?secToHHMMSS(b.arrival):'')+'</div><div style="margin-top:6px;font-size:11px;color:var(--muted)">クリックで時刻表表示</div>';const svg=svgWrap.querySelector('svg');const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;const sp=pt.matrixTransform(svg.getScreenCTM());tooltip.style.left=(sp.x+12)+'px';tooltip.style.top=(sp.y-28)+'px'}
function showWaitingTooltip(tid,stationName,nextDeparture,cx,cy,nextTripId){tooltip.style.display='block';const opNum=opMap[tid]||'?';const destChar=getDestCharByStops(trips[tid],tid);const nextDep=nextDeparture?secToHHMMSS(nextDeparture):'不明';let nextDestChar='?';if(nextTripId&&trips[nextTripId])nextDestChar=getDestCharByStops(trips[nextTripId],nextTripId);tooltip.innerHTML='<div style="font-weight:700">'+opNum+destChar+' → '+opNum+nextDestChar+'</div><div style="margin-top:6px"><b>状態:</b> '+stationName+'で待機中</div><div><b>次発:</b> '+nextDep+'</div><div style="margin-top:6px;font-size:11px;color:var(--muted)">クリックで次の運用の時刻表表示</div>';const svg=svgWrap.querySelector('svg');const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;const sp=pt.matrixTransform(svg.getScreenCTM());tooltip.style.left=(sp.x+12)+'px';tooltip.style.top=(sp.y-28)+'px'}
function hideTooltip(){tooltip.style.display='none'}
function showTimetable(tid){const modal=document.getElementById('timetableModal');const title=document.getElementById('timetableTitle');const body=document.getElementById('timetableBody');if(!modal||!title||!body){console.error('Modal not found');return}const arr=trips[tid]||[];const opNum=opMap[tid]||'?';const destChar=getDestCharByStops(arr,tid);const route=tripRoute[tid]||'UNK';const dayType=tripDayType[tid]==='holiday'?'土日祝':'平日';title.textContent=opNum+destChar+' - 時刻表';const destFullName={'伊':'伊野','後':'後免','高':'高知駅前','桟':'桟橋通五丁目','四':'桟橋通四丁目','橋':'はりまや橋','朝':'朝倉','鏡':'鏡川橋','枡':'枡形','知':'知寄町','文':'文珠通','介':'介良通','領':'領石通','庫':'桟橋車庫'}[destChar]||destChar;let html='<div class="timetable-info">'+tripInfoHtml(tid)+'<strong>運用番号:</strong> '+opNum+'番<br><strong>行先:</strong> '+destFullName+'<br><strong>路線:</strong> '+(route==='EW'?'東西線':route==='SN'?'南北線':'不明')+'<br><strong>運用日:</strong> '+dayType+'</div>'+extrasHtml(tid)+'<table class="timetable-table"><thead><tr><th>順序</th><th>駅名</th><th>到着</th><th>発車</th></tr></thead><tbody>';arr.filter(s0=>!s0.est).forEach((stop,ix)=>{const displayName=stop.label||displayStationName(stop.stop_name||'-');const arrival=stop.arrival!=null?secToHHMMSS(stop.arrival):'-';const departure=stop.departure!=null?secToHHMMSS(stop.departure):'-';html+='<tr><td>'+(ix+1)+'</td><td>'+displayName+'</td><td>'+arrival+'</td><td>'+departure+'</td></tr>'});html+='</tbody></table>';body.innerHTML=html+opDayHtml(tid);bindModal(tid);modal.style.display='flex';console.log('Showing timetable for',tid)}
function closeTimetable(){const modal=document.getElementById('timetableModal');if(modal)modal.style.display='none'}
window.addEventListener('click',e=>{const modal=document.getElementById('timetableModal');if(Date.now()<suppressUntil)return;if(e.target===modal)closeTimetable()});
function setupControls(){const nowBtn=document.getElementById('nowBtn');if(nowBtn)nowBtn.addEventListener('click',()=>{currentTime=nowSeconds();updateTimeUI();renderTrains()});document.querySelectorAll('.jump').forEach(btn=>btn.addEventListener('click',e=>{currentTime+=parseInt(e.currentTarget.dataset.s,10);updateTimeUI();renderTrains()}));const
firstBtn=document.getElementById('firstBtn');if(firstBtn)firstBtn.addEventListener('click',()=>{const t=getFirstDeparture();if(t){currentTime=t;updateTimeUI();renderTrains()}});const playBtn=document.getElementById('playBtn');if(playBtn)playBtn.addEventListener('click',e=>{const btn=e.currentTarget;if(anim==null){btn.textContent='停止 ■';playRate=parseFloat(document.getElementById('speed').value)||1;lastTs=null;anim=requestAnimationFrame(loop)}else{btn.textContent='再生 ▶';cancelAnimationFrame(anim);anim=null}});const speedSel=document.getElementById('speed');if(speedSel)speedSel.addEventListener('change',e=>{playRate=parseFloat(e.target.value)||1;e.target.blur()});const dayTypeSelect=document.getElementById('dayType');if(dayTypeSelect){dayTypeSelect.addEventListener('change',e=>{currentDayType=e.target.value;renderTrains()})}setInterval(()=>{if(anim==null)updateTimeUI()},250)}
function loop(ts){if(!lastTs)lastTs=ts;const dt=(ts-lastTs)/1000;lastTs=ts;currentTime+=dt*playRate;updateTimeUI();renderTrains();anim=requestAnimationFrame(loop)}
function updateTimeUI(){const el=document.getElementById('bigTime');if(el)el.value=secToHHMMSS(Math.floor(currentTime))}
function getFirstDeparture(){let minT=Infinity;Object.values(trips).forEach(arr=>{if(arr.length>0){const t=(arr[0].departure!=null)?arr[0].departure:(arr[0].arrival!=null?arr[0].arrival:Infinity);if(t<minT)minT=t}});return isFinite(minT)?minT:null}
function hhmmssToSec(s){if(!s)return null;const p=s.split(':').map(x=>parseInt(x,10));if(p.length===2)return p[0]*3600+p[1]*60;if(p.length===3)return p[0]*3600+p[1]*60+p[2];return null}
function secToHHMMSS(t){t=Math.floor(((t%86400)+86400)%86400);const h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
async function init(){try{svgWrap=document.getElementById('svgwrap');tooltip=document.getElementById('tooltip');if(!svgWrap)throw new Error('svgwrap not found');await loadData();buildSVG();updateTimeUI();renderTrains();setupControls();setInterval(()=>{renderTrains()},3000);window.addEventListener('resize',relayout);if(window.ResizeObserver){new ResizeObserver(relayout).observe(svgWrap.parentElement)}}catch(err){alert('データ読み込みエラー: '+(err&&err.message?err.message:err));console.error(err)}}
